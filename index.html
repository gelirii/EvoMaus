  <meta name="apple-mobile-web-app-capable" content="yes" />

<body>
  <div id="app">
    <header class="topbar">
      <div class="titleRow">
        <div class="brand"><strong>EvoMaus</strong><span class="version">v1.3</span></div>
        <div class="editorTitleActions">
          <button id="startButton" class="primary">▶ Start</button>
          <button id="stopEditButton" class="dangerButton">■ Stop</button>
        </div>
      </div>

      <div class="editorControls" aria-label="Maze editor controls">
        <button class="tool active" data-tool="wall" aria-label="Wall tool"><span class="swatch"></span><span class="toolName">Wall</span></button>
        <button class="tool" data-tool="cheese" aria-label="Cheese tool"><span class="swatch"></span><span class="toolName">Cheese</span></button>
        <button class="tool" data-tool="danger" aria-label="Danger tool"><span class="swatch"></span><span class="toolName">Danger</span></button>
        <button class="tool" data-tool="goal" aria-label="Goal tool"><span class="swatch"></span><span class="toolName">Goal</span></button>
        <button class="tool" data-tool="eraser" aria-label="Eraser tool"><span class="swatch"></span><span class="toolName">Erase</span></button>

        <label class="populationBox">
          <span>Mice / species</span>
          <input id="population" type="range" min="5" max="125" step="1" value="25" />
          <strong id="populationValue">25</strong>
        </label>
      </div>

      <div class="simActionBar" aria-label="Simulation actions">
        <button id="pauseButton" class="secondary">⏸ Pause</button>
        <button id="speedButton" class="secondary">1× Speed</button>
        <button id="editButton" class="secondary">✎ Edit</button>
        <button id="resetEvolutionButton" class="dangerButton">■ Stop</button>
      </div>

      <div class="simControls" aria-label="Evolution stats">
        <div class="statChip"><span>Gen</span><strong id="genStat">1</strong></div>
        <div class="statChip"><span>Alive</span><strong id="aliveStat">0/0</strong></div>
        <div class="statChip"><span id="progressLabel">Best Progress</span><strong id="progressStat">0%</strong></div>
        <div class="statChip"><span>Cheese</span><strong id="cheeseStat">0</strong></div>
      </div>
    </header>

    <main id="stage">
      <canvas id="mazeCanvas" aria-label="EvoMaus maze editor and simulation"></canvas>
      <div id="toast" role="status"></div>
      <div id="toolHelp" class="mouseNote">Tap or drag to place walls.</div>
      <div class="floating">
        <button id="homeButton" class="floatButton" title="Centre on start">⌂</button>
        <button id="clearButton" class="floatButton" title="Clear maze">⌫</button>
      </div>
    </main>
  </div>
