<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#171b24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EvoMaus</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="titleRow">
        <div class="brand"><strong>EvoMaus</strong><span class="version">v1</span></div>
        <div class="titleActions">
          <button id="startButton" class="primary">▶ Start</button>
          <div class="simTitleActions" aria-label="Simulation actions">
            <button id="pauseButton" class="secondary">⏸ Pause</button>
            <button id="editButton" class="secondary">✎ Edit maze</button>
          </div>
        </div>
      </div>

      <div class="editorControls" aria-label="Maze editor controls">
        <button class="tool active" data-tool="wall" aria-label="Wall tool"><span class="swatch"></span><span class="toolName">Wall</span></button>
        <button class="tool" data-tool="cheese" aria-label="Cheese tool"><span class="swatch"></span><span class="toolName">Cheese</span></button>
        <button class="tool" data-tool="danger" aria-label="Danger tool"><span class="swatch"></span><span class="toolName">Danger</span></button>
        <button class="tool" data-tool="goal" aria-label="Goal tool"><span class="swatch"></span><span class="toolName">Goal</span></button>
        <button class="tool" data-tool="eraser" aria-label="Eraser tool"><span class="swatch"></span><span class="toolName">Erase</span></button>

        <label class="populationBox">
          <span>Mice</span>
          <input id="population" type="range" min="5" max="250" step="5" value="80" />
          <strong id="populationValue">80</strong>
        </label>
      </div>

      <div class="simControls" aria-label="Evolution stats and controls">
        <div class="statChip"><span>Generation</span><strong id="genStat">1</strong></div>
        <div class="statChip"><span>Alive</span><strong id="aliveStat">0/0</strong></div>
        <div class="statChip"><span>Best progress</span><strong id="progressStat">0%</strong></div>
        <div class="statChip"><span>Cheese</span><strong id="cheeseStat">0</strong></div>
        <div class="statChip"><span>Wall hits</span><strong id="wallStat">0</strong></div>
        <button id="speedButton" class="secondary">1×</button>
        <button id="resetEvolutionButton" class="dangerButton">Reset evolution</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="mazeCanvas" aria-label="EvoMaus maze editor and simulation"></canvas>
      <div id="toast" role="status"></div>
      <div id="toolHelp" class="mouseNote">Tap or drag to place walls.</div>
      <div class="floating">
        <button id="homeButton" class="floatButton" title="Centre on start">⌂</button>
        <button id="clearButton" class="floatButton" title="Clear maze">⌫</button>
      </div>
    </main>
  </div>

  <script src="app-1.js?v=3" defer></script>
  <script src="app-2.js?v=3" defer></script>
  <script src="app-3.js?v=3" defer></script>
  <script src="app-4.js?v=3" defer></script>
  <script src="app-5.js?v=3" defer></script>
</body>
</html>
